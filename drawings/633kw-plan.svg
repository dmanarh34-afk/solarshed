<text class="h" x="1410" y="555">NOTES</text>
<text class="lg" x="1410" y="575">1. 633 kWp DC / 600 kWac = ratio 1.055.</text>
<text class="lg" x="1410" y="587">&#160;&#160;&#160;With 7th unit: 700 kWac, ratio 0.90.</text>
<text class="lg" x="1410" y="613">2. DC via wall sleeves from outside trench;</text>
<text class="lg" x="1410" y="625">&#160;&#160;&#160;bottom cable glands on each inverter.</text>
<text class="lg" x="1410" y="651">3. LV AC grated trench -> combiner</text>
<text class="lg" x="1410" y="663">&#160;&#160;&#160;(6 x 160 A MCCB, SPD, meter) -> 1250 A ACB.</text>
<text class="lg" x="1410" y="689">4. MV: TX HV cables to RMU P1 via trench;</text>
<text class="lg" x="1410" y="701">&#160;&#160;&#160;ring cables leave east in sealed transit.</text>
<text class="lg" x="1410" y="727">5. No PV modules on roof, walls or yard.</text>
